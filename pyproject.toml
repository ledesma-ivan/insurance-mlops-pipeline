[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-mlops-pipeline"
version = "0.1.0"

[tool.setuptools.packages.find]
include = ["feature_store*", "training*", "monitoring*", "serving*", "pipeline*"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]